[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-strip"
version = "0.1.0"
description = "Remove personally identifiable information from PDFs (true redaction). Assistive, not a guarantee."
requires-python = ">=3.11"
dependencies = [
    "pymupdf",
    "presidio-analyzer",
    "spacy>=3.8,<3.9",
    "da_core_news_md @ https://github.com/explosion/spacy-models/releases/download/da_core_news_md-3.8.0/da_core_news_md-3.8.0-py3-none-any.whl",
    "en_core_web_md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
dev = ["pytest", "faker"]

[project.scripts]
pii-strip = "pii_strip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
